server {
  listen 8002;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/javascript application/json application/manifest+json text/css image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/push/ {
    proxy_pass http://push-service:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    add_header Cache-Control "no-store";
  }

  location ~* \.(?:css|js|svg|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* ^/(?:index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }
}
